<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />

    <title>服の登録</title>
  </head>

  <body>
    <a href="compare.html">服を比較する</a>

    <h1>服の登録</h1>
    <div id="allData" class="card-container"></div>
    <button class="fab" id="openModalBtn">+</button>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h3>新しい服を登録</h3>
          <button class="close-btn" id="closeModalBtn">×</button>
        </div>
        <select id="category">
          <option value="tops">トップス</option>
          <option value="pants">パンツ</option>
        </select>
        <div class="input-row">
          <label id="nameLabel" for="name">名前：</label>
          <input id="name" type="text" />
        </div>
        <div id="points"></div>
        <div class="input-row">
          <label id="memoLabel" for="memo">メモ：</label>
          <textarea id="memo"></textarea>
        </div>
        <button id="registerButton" class="btn">登録</button>
      </div>
    </div>
    <div id="toast" class="toast">
      <span>登録しました！</span>
    </div>


    <script type="module" src="app.js"></script>
  </body>
</html>
